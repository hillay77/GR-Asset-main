<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password — GR AMS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#0c2d17;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#f7faf5;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.22)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-img{width:56px;height:56px;object-fit:contain;border-radius:12px;border:1px solid #c9e6d0;padding:4px;background:#fff}
.logo h1{font-size:18px;font-weight:700;color:#0d3d23;line-height:1.2}
.logo p{font-size:12px;color:#5f7d63}
h2{font-size:22px;font-weight:600;margin-bottom:6px}
.sub{color:#6b7280;font-size:13px;margin-bottom:28px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
.fg input{width:100%;padding:11px 14px;border:1.5px solid #d8dce3;border-radius:8px;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s}
.fg input:focus{border-color:#0d3d23;box-shadow:0 0 0 3px rgba(13,61,35,.15)}
.error{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
.btn{width:100%;padding:12px;background:#0d3d23;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .15s}
.btn:hover{background:#0b341e}
.link{margin-top:18px;text-align:center;font-size:13px}
.link a{color:#0d3d23;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <img src="/static/img/GR.jpg" alt="GR Logo" class="logo-img">
    <div><h1>GR</h1><p>Asset Management System</p></div>
  </div>
  <h2>Reset Password</h2>
  <p class="sub">Enter your username to receive a temporary password by email.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST" action="{{ url_for('auth.reset_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="fg"><label>Username</label><input name="username" type="text" placeholder="Enter username" autofocus required></div>
    <button type="submit" class="btn">Send Reset Email</button>
  </form>
  <div class="link">
    <a href="{{ url_for('auth.login') }}">Back to Sign In</a>
  </div>
</div>
</body>
</html>
